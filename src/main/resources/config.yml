frame:
  # Команда /paleportal setportal задаёт геометрию; активация только мелодией.
  # Рамка должна быть из укреплённого глубинного сланца.
  enabled: false
  world: world

  # Противоположные углы внешних границ рамки из укреплённого глубинного сланца.
  # Рамка должна лежать в вертикальной плоскости:
  # одинаковый X или одинаковый Z.
  min: "0:0:0"
  max: "0:0:0"

portal:
  material: LIGHT_BLUE_STAINED_GLASS
  particle-period-ticks: 5
  check-period-ticks: 20
  cooldown-seconds: 5

music:
  # Именно числовые ID Note, а не текстовые названия нот.
  notes: [6, 10, 13, 10, 6]
  timeout-seconds: 30
  # Все пять музыкальных блоков должны быть не дальше 30 блоков
  # от геометрического центра рамки (расстояние в 3D).
  radius: 30.0

  # Пять разных музыкальных блоков в порядке исполнения.
  # Формат каждой строки: "x:y:z".
  # Заполняется командой setmusic.
  blocks: []

forest:
  name: pale_forest
  seed: 174421

  entry:
    x: 0.5
    y: 90.0
    z: 0.5
    yaw: 0.0
    pitch: 0.0

  # NIGHT_VISION выдаётся независимо от этой настройки.
  darkness: true

mobs:
  enabled: true
  spawn-period-seconds: 120
  spawn-radius: 64
  minimum-player-distance: 7
  max-loaded: 40
  per-cycle: 6

  normal:
    health: 20.0
    damage: 4.0
    speed: 0.30

  smart:
    health: 30.0
    damage: 8.0
    speed: 0.32

  kind:
    health: 15.0
    damage: 0.0
    speed: 0.25

  ancient:
    health: 50.0
    damage: 6.0
    speed: 0.27
    attack-radius: 10.0
